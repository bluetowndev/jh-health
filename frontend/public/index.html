<!DOCTYPE html>
<html lang="en" data-theme="light">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#0F4C81" />
    <title>JH Health WiFi Complaint Portal</title>
    <meta name="description" content="Jharkhand Health Department WiFi Complaint Management System" />
    <link rel="preload" as="image" href="/hero/dss-banner.png" />
    <script>!function(){try{var t=localStorage.getItem('theme');if(t&&(t==='dark'||t==='light')){document.documentElement.setAttribute('data-theme',t);return}var m=window.matchMedia('(prefers-color-scheme: dark)');document.documentElement.setAttribute('data-theme',m.matches?'dark':'light')}catch(e){}}()</script>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>
    <div id="root"></div>
  </body>
</html>
